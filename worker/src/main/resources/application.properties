spring.application.name=worker
server.address=127.0.0.1
server.port=8083
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.jackson.deserialization.fail-on-unknown-properties=true

# Operator-controlled registration. Jobs cannot choose filesystem paths.
worker.snapshot-id=${WORKER_SNAPSHOT_ID:NOT_CONFIGURED}
worker.base-path=${WORKER_BASE_PATH:NOT_CONFIGURED}
worker.content-hash=${WORKER_CONTENT_HASH:NOT_CONFIGURED}
worker.workspace-root=${WORKER_WORKSPACE_ROOT:${user.home}/bugtrace-workspace}
worker.control-root=${user.home}/bugtrace-ai/worker
# Container execution
worker.cache-seed=${WORKER_CACHE_SEED:${user.home}/.m2/repository}
worker.container-image=${WORKER_CONTAINER_IMAGE:NOT_CONFIGURED}

# Durable backend job queue
worker.queue.enabled=true
worker.queue.backend-url=${WORKER_BACKEND_URL:http://127.0.0.1:8080}
worker.queue.worker-id=${WORKER_ID:laptop-worker-01}