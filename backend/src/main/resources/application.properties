spring.application.name=backend
server.address=127.0.0.1
server.port=8080

# Infrastructure health checks
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# PostgreSQL connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate validates; Flyway changes the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.sql.init.mode=never

# Repository snapshot import
bugtrace.repository-root=${user.home}/bugtrace-ai
bugtrace.workspace-root=${user.home}/bugtrace-workspace

bugtrace.workflow.snapshot-id=e0a3b286-c6b1-454d-84af-976f31b8d1c6

# Model provider
bugtrace.ai.provider=${BUGTRACE_AI_PROVIDER:mock}
bugtrace.ai.model=${BUGTRACE_AI_MODEL:mock-v1}
bugtrace.ai.api-key=${OPENAI_API_KEY:}
bugtrace.ai.timeout-seconds=60
bugtrace.ai.max-output-tokens=1500

# Explicit public benchmark registration
bugtrace.benchmark.enabled=true
bugtrace.benchmark.repository=${user.home}/bbp
bugtrace.benchmark.release-commit=6c4f8856bb7e4d49e953a8b086d594d2f505838d